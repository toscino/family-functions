<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Game Uploader</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simple loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-2xl w-full m-4">

        <!-- ===== PARENT SETUP (Hidden by default if settings are saved) ===== -->
        <div id="settings-panel">
            <h1 class="text-3xl font-bold text-center mb-4 text-gray-800">Uploader Setup</h1>
            <p class="text-gray-600 mb-6 text-center">Hi Parent! Do this one-time setup. These settings will be saved in your browser's local storage so your kids don't see this.</p>
            
            <div class="space-y-4">
                <div>
                    <label for="github-user" class="block text-sm font-medium text-gray-700">GitHub Username</label>
                    <input type="text" id="github-user" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., your-github-username">
                </div>
                <div>
                    <label for="github-token" class="block text-sm font-medium text-gray-700">GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="github-token" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Paste your Fine-Grained token here (it's a secret!)">
                    <p class="mt-2 text-xs text-gray-500">Use a <b class="font-medium">Fine-grained token</b> with <b class="font-medium">Read/Write</b> for <pre class="inline rounded bg-gray-200 px-1 py-0.5">Contents</pre> and <b class="font-medium">Read-only</b> for <pre class="inline rounded bg-gray-200 px-1 py-0.5">Metadata</pre>.</p>
                </div>
                
                <button id="save-settings" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold shadow-lg hover:bg-blue-700 transition duration-300">
                    Save Settings & Start Uploading!
                </button>
            </div>
        </div>

        <!-- ===== KIDS' UPLOADER (Shown by default if settings are saved) ===== -->
        <div id="uploader-panel" class="hidden">
            <h1 class="text-3xl font-bold text-center mb-6 text-blue-600">🚀 Upload Your Game! 🚀</h1>
            
            <div class="space-y-6">
                <!-- 1. Repository Dropdown -->
                <div>
                    <label for="repo-select" class="block text-xl font-medium text-gray-700 mb-2">1. Choose a Repository:</label>
                    <select id="repo-select" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 text-lg focus:border-blue-500 focus:ring-blue-500">
                        <option value="">Loading repositories...</option>
                    </select>
                </div>

                <!-- 2. Game Name (now with datalist) -->
                <div>
                    <label for="game-name" class="block text-xl font-medium text-gray-700 mb-2">2. Choose or Create a Game:</label>
                    <input type="text" id="game-name" list="game-list" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 text-lg focus:border-blue-500 focus:ring-blue-500" placeholder="Type a new name or pick one...">
                    <datalist id="game-list">
                        <!-- Existing game names will be populated here by JS -->
                    </datalist>
                </div>

                <!-- 3. Paste Code -->
                <div>
                    <label for="game-code" class="block text-xl font-medium text-gray-700 mb-2">3. Paste your game code here:</label>
                    <textarea id="game-code" rows="10" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 font-mono text-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Paste the HTML code from Gemini..."></textarea>
                </div>

                <button id="upload-button" class="w-full bg-green-600 text-white py-4 px-6 rounded-lg font-bold text-2xl shadow-xl hover:bg-green-700 transition duration-300 transform hover:scale-105">
                    Upload!
                </button>
            </div>

            <!-- Status/Result Panel -->
            <div id="status-panel" class="mt-6 text-center"></div>
        </div>

        <!-- Button to clear settings and show setup panel -->
        <div class="text-center mt-4">
            <button id="reset-settings" class="text-xs text-gray-400 hover:text-red-500">Reset Settings</button>
        </div>
    </div>

    <script>
        // === App Logic ===
        const settingsPanel = document.getElementById('settings-panel');
        const uploaderPanel = document.getElementById('uploader-panel');
        const saveButton = document.getElementById('save-settings');
        const resetButton = document.getElementById('reset-settings');
        const uploadButton = document.getElementById('upload-button');
        const statusPanel = document.getElementById('status-panel');

        const userIn = document.getElementById('github-user');
        const tokenIn = document.getElementById('github-token');

        const repoSelectIn = document.getElementById('repo-select');
        const gameNameIn = document.getElementById('game-name');
        const gameCodeIn = document.getElementById('game-code');
        const gameList = document.getElementById('game-list'); // NEW: Datalist element

        // NEW: Function to load existing games for the selected repo
        async function loadExistingGames(repo) {
            const user = localStorage.getItem('github_user');
            const token = localStorage.getItem('github_token');
            
            gameList.innerHTML = ''; // Clear old game list
            gameNameIn.value = ''; // Clear old game name
            statusPanel.innerHTML = ''; // Clear old status

            if (!user || !token || !repo) {
                return;
            }

            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/`;
            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
            };

            try {
                const response = await fetch(apiUrl, { headers });
                if (!response.ok) {
                    throw new Error(`Failed to fetch game list (status ${response.status}).`);
                }
                
                const files = await response.json();
                
                // Filter for .html files (the games), ignore index.html (the uploader app itself)
                const htmlFiles = files.filter(file => 
                    file.type === 'file' && 
                    file.name.endsWith('.html') &&
                    file.name !== 'index.html'
                );

                if (htmlFiles.length === 0) {
                    return; // No games found, just leave the list empty
                }

                // Populate datalist
                htmlFiles.forEach(file => {
                    // Strip .html extension for a clean name
                    const gameName = file.name.replace(/\.html$/, ''); 
                    const option = document.createElement('option');
                    option.value = gameName; // The value is what they see and what the input gets
                    gameList.appendChild(option);
                });

            } catch (error) {
                console.error(error);
                statusPanel.innerHTML = `<p class="text-red-500 font-semibold">Error: ${error.message}</p>`;
            }
        }

        // NEW: Function to load repositories
        async function loadRepositories() {
            const user = localStorage.getItem('github_user');
            const token = localStorage.getItem('github_token');

            if (!user || !token) {
                console.error("Settings are missing.");
                return;
            }

            repoSelectIn.innerHTML = '<option value="">Loading repositories...</option>';
            repoSelectIn.disabled = true;
            
            // Use /user/repos, which works for Fine-Grained PATs
            const apiUrl = `https://api.github.com/user/repos?sort=updated&per_page=100`;
            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
            };

            try {
                const response = await fetch(apiUrl, { headers });
                if (!response.ok) {
                    throw new Error(`Failed to fetch repos (status ${response.status}). Check PAT/username.`);
                }
                
                const repos = await response.json();
                
                // We only want repos they can push to (which the fine-grained PAT defines)
                const writeableRepos = repos.filter(repo => repo.permissions.push === true);
                
                repoSelectIn.innerHTML = ''; // Clear "loading"

                if (writeableRepos.length === 0) {
                     repoSelectIn.innerHTML = '<option value="">No repositories found!</option>';
                     return;
                }

                // Populate dropdown
                writeableRepos.forEach(repo => {
                    const option = document.createElement('option');
                    option.value = repo.name;
                    option.textContent = repo.name;
                    repoSelectIn.appendChild(option);
                });

                // NEW: After loading repos, load games for the FIRST repo in the list
                if (writeableRepos.length > 0) {
                    loadExistingGames(writeableRepos[0].name);
                }

            } catch (error) {
                console.error(error);
                statusPanel.innerHTML = `<p class="text-red-500 font-semibold">Error: ${error.message}</p>`;
                repoSelectIn.innerHTML = '<option value="">Error loading repos!</option>';
            } finally {
                repoSelectIn.disabled = false;
            }
        }

        // NEW: Add event listener to reload games when repo changes
        repoSelectIn.addEventListener('change', () => {
            const selectedRepo = repoSelectIn.value;
            if (selectedRepo) {
                loadExistingGames(selectedRepo);
            } else {
                gameList.innerHTML = ''; // Clear list if no repo is selected
            }
        });

        // On page load, check if settings are saved
        window.addEventListener('load', () => {
            if (localStorage.getItem('github_user') && localStorage.getItem('github_token')) {
                // If settings exist, show uploader
                settingsPanel.classList.add('hidden');
                uploaderPanel.classList.remove('hidden');
                // Load repos (which will then load games)
                loadRepositories(); 
            } else {
                // If no settings, show setup
                settingsPanel.classList.remove('hidden');
                uploaderPanel.classList.add('hidden');
            }
        });

        // Save settings to localStorage
        saveButton.addEventListener('click', () => {
            const user = userIn.value.trim();
            const token = tokenIn.value.trim();

            if (!user || !token) {
                alert('Please fill in both Username and Token.');
                return;
            }

            localStorage.setItem('github_user', user);
            localStorage.setItem('github_token', token);

            settingsPanel.classList.add('hidden');
            uploaderPanel.classList.remove('hidden');
            
            // Load repos (which will then load games)
            loadRepositories();
        });

        // Reset settings
        resetButton.addEventListener('click', () => {
            if (confirm('Are you sure you want to reset the settings? You will need to enter the GitHub details again.')) {
                localStorage.removeItem('github_user');
                localStorage.removeItem('github_token');
                
                userIn.value = '';
                tokenIn.value = '';

                settingsPanel.classList.remove('hidden');
                uploaderPanel.classList.add('hidden');
                statusPanel.innerHTML = '';
                repoSelectIn.innerHTML = '<option value="">Loading repositories...</option>'; // Reset dropdown
                gameList.innerHTML = ''; // Reset game list
            }
        });

        // Main upload function
        uploadButton.addEventListener('click', async () => {
            // This logic remains the same, as `gameNameIn.value` will
            // be whatever the user selected or typed.
            const repo = repoSelectIn.value;
            const gameName = gameNameIn.value.trim();
            const gameCode = gameCodeIn.value;

            if (!repo) {
                statusPanel.innerHTML = '<p class="text-red-500 font-semibold">Please choose a repository!</p>';
                return;
            }

            if (!gameName || !gameCode) {
                statusPanel.innerHTML = '<p class="text-red-500 font-semibold">Please add a name and paste your game code!</p>';
                return;
            }

            // --- Get settings ---
            const user = localStorage.getItem('github_user');
            const token = localStorage.getItem('github_token');

            if (!user || !token) {
                alert('Settings are missing. Please reset and re-configure.');
                return;
            }

            // --- Show loading ---
            statusPanel.innerHTML = '<div class="flex justify-center items-center"><div class="loader mr-3"></div><p class="text-gray-700">Uploading to GitHub...</p></div>';
            uploadButton.disabled = true;
            uploadButton.classList.add('opacity-50', 'cursor-not-allowed');

            // --- Prepare data ---
            const fileName = gameName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') + '.html';
            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${fileName}`;
            
            const encodedContent = btoa(unescape(encodeURIComponent(gameCode)));

            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
            };

            let sha = null;

            try {
                // --- 1. Check if file exists to get its SHA (for updating) ---
                // This is the core logic that handles create vs. update
                const getResponse = await fetch(apiUrl, { headers });
                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha; // File exists, get its SHA to update it
                }

                // --- 2. Create or Update the file (PUT) ---
                const body = {
                    message: `Upload game: ${gameName}`,
                    content: encodedContent
                };
                if (sha) {
                    body.sha = sha; // <-- This is what tells GitHub to UPDATE
                }

                const putResponse = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!putResponse.ok) {
                    const error = await putResponse.json();
                    throw new Error(error.message || 'Failed to upload to GitHub.');
                }
                
                // --- 3. Show Success! ---
                const userForUrl = localStorage.getItem('github_user');
                const liveUrl = `https://${userForUrl}.github.io/${repo}/${fileName}`;
                statusPanel.innerHTML = `
                    <h3 class="text-2xl font-bold text-green-600 mb-4">Success!</h3>
                    <p class="text-gray-700 mb-4">Your game is live! Click the link to play:</p>
                    <a href="${liveUrl}" target="_blank" class="inline-block bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold shadow-lg hover:bg-blue-700 transition duration-300">
                        Play ${gameName}
                    </a>
                `;
                
                // Clear inputs for next upload, but keep dropdown
                gameNameIn.value = '';
                gameCodeIn.value = '';
                // Refresh the game list to show the new/updated game
                loadExistingGames(repo); 

            } catch (error) {
                console.error(error);
                statusPanel.innerHTML = `<p class="text-red-500 font-semibold">Error: ${error.message}. Check console or PAT permissions.</p>`;
            } finally {
                // Re-enable button
                uploadButton.disabled = false;
                uploadButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
