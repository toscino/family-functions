<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Game Uploader (Pro)</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simple loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-3xl w-full m-4">

        <!-- ===== PARENT SETUP (Hidden by default if settings are saved) ===== -->
        <div id="settings-panel">
            <h1 class="text-3xl font-bold text-center mb-4 text-gray-800">Uploader Setup</h1>
            <p class="text-gray-600 mb-6 text-center">Hi Parent! Do this one-time setup. These settings will be saved in your browser's local storage.</p>
            <div class="space-y-4">
                <div>
                    <label for="github-user" class="block text-sm font-medium text-gray-700">GitHub Username</label>
                    <input type="text" id="github-user" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., your-github-username">
                </div>
                <div>
                    <label for="github-token" class="block text-sm font-medium text-gray-700">GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="github-token" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Paste your Fine-Grained token here (it's a secret!)">
                    <p class="mt-2 text-xs text-gray-500">Use a <b class="font-medium">Fine-grained token</b> with <b class="font-medium">Read/Write</b> for <pre class="inline rounded bg-gray-200 px-1 py-0.5">Contents</pre> and <b class="font-medium">Read-only</b> for <pre class="inline rounded bg-gray-200 px-1 py-0.5">Metadata</pre>.</p>
                </div>
                <button id="save-settings" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold shadow-lg hover:bg-blue-700 transition duration-300">
                    Save Settings & Start Uploading!
                </button>
            </div>
        </div>

        <!-- ===== KIDS' UPLOADER (Shown by default if settings are saved) ===== -->
        <div id="uploader-panel" class="hidden">
            <h1 class="text-3xl font-bold text-center mb-6 text-blue-600">🚀 Upload Your Game! 🚀</h1>
            
            <div class="space-y-6">
                <!-- 1. Repository Section (Conditionally hidden) -->
                <div id="repo-wrapper">
                    <div id="repo-select-wrapper" class="hidden">
                        <label id="repo-label" for="repo-select" class="block text-xl font-medium text-gray-700 mb-2">1. Choose a Repository:</label>
                        <select id="repo-select" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 text-lg focus:border-blue-500 focus:ring-blue-500"></select>
                    </div>
                    <div id="repo-display" class="hidden rounded-lg bg-gray-100 p-4">
                        <span class="text-gray-600">Uploading to:</span>
                        <strong id="repo-display-name" class="text-lg text-gray-900 ml-2"></strong>
                    </div>
                </div>

                <!-- 2. Game Name (now a folder name) -->
                <div>
                    <label id="game-label" for="game-name" class="block text-xl font-medium text-gray-700 mb-2">1. Choose or Create Game Folder:</label>
                    <input type="text" id="game-name" list="game-list" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 text-lg focus:border-blue-500 focus:ring-blue-500" placeholder="Type a new game name or pick one...">
                    <datalist id="game-list">
                        <!-- Existing game folders will be populated here by JS -->
                    </datalist>
                </div>

                <!-- 3. Code Paste Sections -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- HTML (Required) -->
                    <div>
                        <label id="code-label" for="code-html" class="block text-xl font-medium text-gray-700 mb-2">2. Paste <span class="text-red-500">*</span> <code class="text-lg">index.html</code> Code:</label>
                        <textarea id="code-html" rows="12" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 font-mono text-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Paste the HTML code... (Required)"></textarea>
                    </div>
                    
                    <!-- CSS (Optional) -->
                    <div>
                        <label id="style-label" for="code-css" class="block text-xl font-medium text-gray-700 mb-2">3. Paste <code class="text-lg">style.css</code> Code:</label>
                        <textarea id="code-css" rows="12" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 font-mono text-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Paste the CSS code... (Optional)"></textarea>
                    </div>
                </div>
                
                <!-- JS (Optional) -->
                <div>
                    <label id="script-label" for="code-js" class="block text-xl font-medium text-gray-700 mb-2">4. Paste <code class="text-lg">script.js</code> Code:</label>
                    <textarea id="code-js" rows="12" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-4 font-mono text-sm focus:border-blue-500 focus:ring-blue-500" placeholder="Paste the JavaScript code... (Optional)"></textarea>
                </div>

                <button id="upload-button" class="w-full bg-green-600 text-white py-4 px-6 rounded-lg font-bold text-2xl shadow-xl hover:bg-green-700 transition duration-300 transform hover:scale-105">
                    Upload All Files!
                </button>
            </div>

            <!-- Status/Result Panel -->
            <div id="status-panel" class="mt-6 text-center"></div>
        </div>

        <!-- Button to clear settings and show setup panel -->
        <div class="text-center mt-4">
            <button id="reset-settings" class="text-xs text-gray-400 hover:text-red-500">Reset Settings</button>
        </div>
    </div>

    <script>
        // === App Logic ===
        console.log("GitHub Game Uploader v2.0 (Pro/Folder-Mode)");

        const settingsPanel = document.getElementById('settings-panel');
        const uploaderPanel = document.getElementById('uploader-panel');
        const saveButton = document.getElementById('save-settings');
        const resetButton = document.getElementById('reset-settings');
        const uploadButton = document.getElementById('upload-button');
        const statusPanel = document.getElementById('status-panel');

        const userIn = document.getElementById('github-user');
        const tokenIn = document.getElementById('github-token');

        // Uploader panel elements
        const repoSelectWrapper = document.getElementById('repo-select-wrapper');
        const repoDisplay = document.getElementById('repo-display');
        const repoDisplayName = document.getElementById('repo-display-name');
        const repoSelectIn = document.getElementById('repo-select');
        const gameNameIn = document.getElementById('game-name');
        const gameList = document.getElementById('game-list');
        
        // NEW: Code textareas
        const codeHtmlIn = document.getElementById('code-html');
        const codeCssIn = document.getElementById('code-css');
        const codeJsIn = document.getElementById('code-js');
        
        // Labels for re-numbering
        const repoLabel = document.getElementById('repo-label');
        const gameLabel = document.getElementById('game-label');
        const codeLabel = document.getElementById('code-label');
        const styleLabel = document.getElementById('style-label');
        const scriptLabel = document.getElementById('script-label');

        let autoSelectedRepo = null;

        // Function to load existing games (folders) for the selected repo
        async function loadExistingGames(repo) {
            const user = localStorage.getItem('github_user');
            const token = localStorage.getItem('github_token');
            
            gameList.innerHTML = ''; 
            gameNameIn.value = '';
            statusPanel.innerHTML = ''; 

            if (!user || !token || !repo) return;

            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/`;
            const headers = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };

            try {
                const response = await fetch(apiUrl, { headers });
                if (response.status === 404) return; // Empty repo
                if (!response.ok) throw new Error(`Failed to fetch game list (status ${response.status}).`);
                
                const contents = await response.json();
                
                // NEW: We now look for directories, not files
                const gameFolders = contents.filter(item => 
                    item.type === 'dir'
                );

                if (gameFolders.length === 0) return;

                gameFolders.forEach(folder => {
                    const option = document.createElement('option');
                    option.value = folder.name; // e.g., "tictac"
                    gameList.appendChild(option);
                });

            } catch (error) {
                console.error(error);
                statusPanel.innerHTML = `<p class="text-red-500 font-semibold">Error: ${error.message}</p>`;
            }
        }
        
        // NEW: When a game folder is selected, auto-fill the text boxes
        gameNameIn.addEventListener('change', async () => {
            const repo = autoSelectedRepo || repoSelectIn.value;
            const gameName = gameNameIn.value.trim();
            if (!repo || !gameName) return;

            // Clear boxes first
            codeHtmlIn.value = 'Loading...';
            codeCssIn.value = '';
            codeJsIn.value = '';
            
            // Helper to fetch file content
            const fetchFile = async (fileName) => {
                const user = localStorage.getItem('github_user');
                const token = localStorage.getItem('github_token');
                const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${gameName}/${fileName}`;
                const headers = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };
                
                try {
                    const response = await fetch(apiUrl, { headers });
                    if (!response.ok) return null; // File might not exist
                    const data = await response.json();
                    // Decode from Base64
                    return decodeURIComponent(escape(atob(data.content)));
                } catch (e) {
                    console.error(e);
                    return null;
                }
            };

            const [html, css, js] = await Promise.all([
                fetchFile('index.html'),
                fetchFile('style.css'),
                fetchFile('script.js')
            ]);

            codeHtmlIn.value = html || ''; // html is required, but might be a new game
            codeCssIn.value = css || '';
            codeJsIn.value = js || '';
        });

        // Function to load repositories
        async function loadRepositories() {
            const user = localStorage.getItem('github_user');
            const token = localStorage.getItem('github_token');

            if (!user || !token) return;

            autoSelectedRepo = null;
            repoSelectIn.innerHTML = '<option value="">Loading...</option>';
            repoSelectIn.disabled = true;
            statusPanel.innerHTML = '';
            
            const apiUrl = `https://api.github.com/user/repos?sort=updated&per_page=100`;
            const headers = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };

            try {
                const response = await fetch(apiUrl, { headers });
                if (!response.ok) throw new Error(`Failed to fetch repos (status ${response.status}).`);
                
                const repos = await response.json();
                const writeableRepos = repos.filter(repo => repo.permissions.push === true);
                
                if (writeableRepos.length === 0) {
                    statusPanel.innerHTML = '<p class="text-red-500 font-semibold">Error: This PAT does not have write access to any repositories.</p>';
                    repoSelectWrapper.classList.add('hidden');
                    repoDisplay.classList.add('hidden');
                
                } else if (writeableRepos.length === 1) {
                    const repoName = writeableRepos[0].name;
                    autoSelectedRepo = repoName;
                    repoSelectWrapper.classList.add('hidden');
                    repoDisplay.classList.remove('hidden');
                    repoDisplayName.textContent = repoName;
                    
                    // Re-number steps
                    gameLabel.textContent = "1. Choose or Create Game Folder:";
                    codeLabel.textContent = '2. Paste * index.html Code:';
                    styleLabel.textContent = '3. Paste style.css Code:';
                    scriptLabel.textContent = '4. Paste script.js Code:';
                    
                    loadExistingGames(repoName);
                
                } else {
                    autoSelectedRepo = null;
                    repoSelectWrapper.classList.remove('hidden');
                    repoDisplay.classList.add('hidden');
                    repoSelectIn.innerHTML = '';
                    
                    writeableRepos.forEach(repo => {
                        const option = document.createElement('option');
                        option.value = repo.name;
                        option.textContent = repo.name;
                        repoSelectIn.appendChild(option);
                    });
                    
                    // Re-number steps
                    repoLabel.textContent = "1. Choose a Repository:";
                    gameLabel.textContent = "2. Choose or Create Game Folder:";
                    codeLabel.textContent = '3. Paste * index.html Code:';
                    styleLabel.textContent = '4. Paste style.css Code:';
                    scriptLabel.textContent = '5. Paste script.js Code:';

                    loadExistingGames(writeableRepos[0].name);
                    repoSelectIn.disabled = false;
                }

            } catch (error) {
                console.error(error);
                statusPanel.innerHTML = `<p class="text-red-500 font-semibold">Error: ${error.message}</p>`;
            }
        }

        // Add event listener to reload games when (visible) repo dropdown changes
        repoSelectIn.addEventListener('change', () => {
            loadExistingGames(repoSelectIn.value);
        });

        // On page load
        window.addEventListener('load', () => {
            if (localStorage.getItem('github_user') && localStorage.getItem('github_token')) {
                settingsPanel.classList.add('hidden');
                uploaderPanel.classList.remove('hidden');
                loadRepositories(); 
            } else {
                settingsPanel.classList.remove('hidden');
                uploaderPanel.classList.add('hidden');
            }
        });

        // Save settings
        saveButton.addEventListener('click', () => {
            const user = userIn.value.trim();
            const token = tokenIn.value.trim();
            if (!user || !token) { alert('Please fill in both Username and Token.'); return; }
            localStorage.setItem('github_user', user);
            localStorage.setItem('github_token', token);
            settingsPanel.classList.add('hidden');
            uploaderPanel.classList.remove('hidden');
            loadRepositories();
        });

        // Reset settings
        resetButton.addEventListener('click', () => {
            if (confirm('Are you sure you want to reset the settings?')) {
                localStorage.clear(); 
                userIn.value = '';
                tokenIn.value = '';
                autoSelectedRepo = null;
                settingsPanel.classList.remove('hidden');
                uploaderPanel.classList.add('hidden');
                statusPanel.innerHTML = '';
            }
        });

        // === Main Upload Function ===
        uploadButton.addEventListener('click', async () => {
            const repo = autoSelectedRepo || repoSelectIn.value;
            const gameName = gameNameIn.value.trim();
            const htmlContent = codeHtmlIn.value.trim();
            const cssContent = codeCssIn.value.trim();
            const jsContent = codeJsIn.value.trim();

            if (!repo) {
                statusPanel.innerHTML = '<p class="text-red-500 font-semibold">Please choose a repository!</p>';
                return;
            }
            if (!gameName) {
                statusPanel.innerHTML = '<p class="text-red-500 font-semibold">Please add a game name!</p>';
                return;
            }
            if (!htmlContent) {
                statusPanel.innerHTML = '<p class="text-red-500 font-semibold">The index.html code is required!</p>';
                return;
            }

            const user = localStorage.getItem('github_user');
            const token = localStorage.getItem('github_token');

            if (!user || !token) {
                alert('Settings are missing. Please reset and re-configure.');
                return;
            }

            statusPanel.innerHTML = '<div class="flex justify-center items-center"><div class="loader mr-3"></div><p class="text-gray-700">Uploading files...</p></div>';
            uploadButton.disabled = true;
            uploadButton.classList.add('opacity-50', 'cursor-not-allowed');

            // --- Helper function for a single file upload ---
            const uploadFile = async (fileName, fileContent) => {
                // If content is empty, just skip this file
                if (!fileContent) return { success: true, skipped: true }; 
                
                const filePath = `${gameName}/${fileName}`;
                const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
                const headers = { 
                    'Authorization': `token ${token}`, 
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };
                
                // btoa trick for UTF-8
                const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

                let sha = null;
                try {
                    // 1. Check if file exists to get SHA
                    const getResponse = await fetch(apiUrl, { headers: { ...headers } }); // remove content-type
                    if (getResponse.ok) {
                        sha = (await getResponse.json()).sha;
                    }
                } catch (e) { /* File doesn't exist, which is fine */ }
                
                // 2. Create or Update file
                const body = {
                    message: `Upload game file: ${filePath}`,
                    content: encodedContent,
                    ...(sha && { sha: sha }) // Add sha if it exists (for updates)
                };

                try {
                    const putResponse = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: headers,
                        body: JSON.stringify(body)
                    });
                    if (!putResponse.ok) {
                        throw new Error(`Failed to upload ${fileName}: ${(await putResponse.json()).message}`);
                    }
                    return { success: true };
                } catch (error) {
                    return { success: false, error: error.message };
                }
            };
            
            // --- Run all uploads ---
            try {
                const results = await Promise.all([
                    uploadFile('index.html', htmlContent),
                    uploadFile('style.css', cssContent),
                    uploadFile('script.js', jsContent)
                ]);

                const failures = results.filter(r => !r.success);
                if (failures.length > 0) {
                    throw new Error(failures.map(f => f.error).join(', '));
                }

                // --- 3. Show Success! ---
                const liveUrl = `https://${user}.github.io/${repo}/${gameName}/`;
                statusPanel.innerHTML = `
                    <h3 class="text-2xl font-bold text-green-600 mb-4">Success!</h3>
                    <p class="text-gray-700 mb-4">Your game is live! Click the link to play:</p>
                    <a href="${liveUrl}" target="_blank" class="inline-block bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold shadow-lg hover:bg-blue-700 transition duration-300">
                        Play ${gameName}
                    </a>
                `;
                
                // Clear inputs and refresh game list
                gameNameIn.value = '';
                codeHtmlIn.value = '';
                codeCssIn.value = '';
                codeJsIn.value = '';
                loadExistingGames(repo); 

            } catch (error) {
                console.error(error);
                statusPanel.innerHTML = `<p class="text-red-500 font-semibold">Error: ${error.message}</p>`;
            } finally {
                uploadButton.disabled = false;
                uploadButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
